services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: e-arena-sqlserver
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Seed__AdminUsername: ${ADMIN_USERNAME}
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
    ports:
      - "1433:1433"
    networks:
      - app-network
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P ${DB_PASSWORD} -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/EArenaTournamentManager.API/Dockerfile
    container_name: e-arena-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EArenaTournamentManagerDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: EArenaTournamentManager
      Jwt__Audience: EArenaTournamentManager
      Jwt__ExpiryHours: 10
      Seed__AdminUsername: ${ADMIN_USERNAME}
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/EArenaTournamentManager.Web/Dockerfile
    container_name: e-arena-web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5000:8080"
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  sqlserver-data: