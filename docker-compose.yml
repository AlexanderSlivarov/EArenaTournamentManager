version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: e-arena-tournament-manager-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrongPassword123!
    ports:
      - "1433:1433"
    networks:
      - app-network
    volumes:
      - sqlserver-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: src/EArenaTournamentManager.API/Dockerfile
    container_name: e-arena-tournament-manager-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=EArenaTournamentManagerDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;
    ports:
      - "5001:80"
    depends_on:
      - sqlserver
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: src/EArenaTournamentManager.Web/Dockerfile
    container_name: e-arena-tournament-manager-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:80"
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  sqlserver-data: